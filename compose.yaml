services:
  analytics:
    build: .
    ports:
      - "127.0.0.1:18080:8000"
    environment:
      SETUP_TOKEN: ${SETUP_TOKEN:?Set a random SETUP_TOKEN in .env}
      DATABASE_URL: sqlite:////data/analytics-v1.db
    volumes:
      - analytics-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  analytics-data:
