name: Backend checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: analytics_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U analytics -d analytics_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest -q
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://analytics:local-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/analytics_test
      - run: node --check app/static/app.js
      - run: docker compose config --quiet
        env:
          SETUP_TOKEN: local-ci-validation
      - name: Build and check the container
        run: docker compose up --build -d --wait --wait-timeout 90
        env:
          SETUP_TOKEN: local-ci-validation
      - name: Stop the test container
        if: always()
        run: docker compose down -v
        env:
          SETUP_TOKEN: local-ci-validation
